/* ---------- responsive ---------- */
.nav-burger{display:none}.nav-panel{display:flex;flex-direction:column}
@media (min-width:769px){.nav-panel{display:none!important}}
@media (max-width:1024px){
 [style*="padding: 8rem 5rem"]{padding:5.5rem 2rem!important}
 #home{padding-left:2rem!important;padding-right:2rem!important;gap:2.5rem!important}
 footer[style]{padding:2rem!important}
 nav[style]{padding:0 1.5rem!important}
 [style*="grid-template-columns: 1fr 1fr"]{gap:2.5rem!important}
 [style*="320px 1fr"]{grid-template-columns:240px 1fr!important}
 [style*="repeat(3, 1fr)"]{gap:1rem!important}
}
@media (max-width:768px){
 html{scroll-padding-top:72px}
 .nav-link{display:none!important}.nav-burger{display:flex!important}
 nav[style]{padding:0 1rem!important}
 [style*="padding: 8rem 5rem"]{padding:4rem 1.25rem!important}
 #home{grid-template-columns:1fr!important;min-height:auto!important;padding:96px 1.25rem 3rem!important;gap:2rem!important}
 #home h1{font-size:clamp(2.6rem,13vw,3.6rem)!important}
 #home img{width:min(72vw,300px)!important}
 #home [style*="grid-column"]{flex-wrap:wrap!important;gap:1.25rem 1rem!important}
 #home [style*="grid-column"]>div{flex:1 1 40%!important}
 [style*="width: 600px"]{width:320px!important;height:320px!important}
 [style*="width: 400px"]{width:240px!important;height:240px!important}
 [style*="grid-template-columns: 1fr 1fr"],[style*="grid-template-columns: repeat(2, 1fr)"],[style*="grid-template-columns: 1fr 1.5fr"],[style*="grid-template-columns: 320px 1fr"]{grid-template-columns:1fr!important;gap:2rem!important}
 [style*="grid-template-columns: 320px 1fr"]{gap:0!important}
 [style*="grid-template-columns: 320px 1fr"]>div:first-child{height:200px!important}
 [style*="padding: 2rem;"]{padding:1.25rem!important}
 [style*="justify-content: space-between"][style*="align-items: flex-start"]{flex-wrap:wrap!important;gap:.6rem!important}
 [style*="margin-bottom: 4rem"]{margin-bottom:2rem!important}
 #portfolio{grid-template-columns:repeat(2,1fr)!important;gap:.75rem!important}
 footer[style]{flex-direction:column!important;gap:1rem!important;text-align:center!important;padding:2rem 1.25rem!important}
 [style*="padding: 4rem 2.5rem 6rem"]{padding:2.5rem 1.25rem 4rem!important}
 [style*="padding: 1.25rem 2.5rem"]{padding:1rem 1.25rem!important}
}
@media (max-width:480px){
 #portfolio{grid-template-columns:1fr!important}
 #home [style*="grid-column"]>div{flex:1 1 44%!important}
}
@media (hover:none),(pointer:coarse){
 *,*:hover,*:focus{cursor:auto!important}.cursor{display:none!important}
 [style*="translateX(-8px)"]{opacity:1!important;transform:none!important}
}
